name: Crear Ejecutable Windows

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Descargar archivos del repositorio
      uses: actions/checkout@v4

    - name: Instalar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar librerías necesarias
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter pyinstaller tkcalendar Pillow

    - name: Convertir a .exe
      run: |
        pyinstaller --noconfirm --onefile --windowed ipsicol.py

    - name: Subir archivo para descargar
      uses: actions/upload-artifact@v4
      with:
        name: Programa_Ipsicol_EXE
        path: dist/ipsicol.exe
